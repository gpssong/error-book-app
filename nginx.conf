server {
    listen 4040 default_server;
    client_max_body_size 20m;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # v44 P2: 题目图片静态文件。backend 写 /app/public/uploads(挂 ./backend-public/uploads),
    # nginx 也挂同一目录到 /uploads-static, 直接以静态 + 强缓存吐图(不走 backend),
    # 避免每次打开列表都拉 11MB base64 JSON。
    # 用 ^~ 前缀让 /uploads/ 优先于下方 .jpg 正则匹配, 避免被 root try_files 404。
    location ^~ /uploads/ {
        alias /uploads-static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到 backend 容器
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 180s;
    }
}
